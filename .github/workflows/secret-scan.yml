# Fails a push or pull request that adds an API key, token or password to the repository.
# On a push it scans only the new commits, so the old key already in history (commit c4f8e8b,
# see UserDo.md) does not fail every run; revoke that key rather than relying on this check.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
